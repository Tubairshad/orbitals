<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Orbital Simulator</title>
    <script src="https://cdn.plot.ly/plotly-2.24.1.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f4f9; margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #333; }
        .controls { display: flex; gap: 20px; margin-bottom: 20px; flex-wrap: wrap; justify-content: center; background: #eef2f5; padding: 15px; border-radius: 8px;}
        .control-group { display: flex; flex-direction: column; }
        select, input, button { padding: 8px; border-radius: 4px; border: 1px solid #ccc; font-size: 16px; }
        .grid { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
        @media (max-width: 800px) { .grid { grid-template-columns: 1fr; } }
        .plot-container { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 10px; }
        .equations { font-size: 1.1em; text-align: center; margin: 15px 0; font-family: 'Courier New', Courier, monospace; background: #fdfdfd; padding: 10px; border-left: 4px solid #1f77b4;}
    </style>
</head>
<body>

<div class="container">
    <h1>⚛️ Interactive Quantum Orbital Visualization</h1>
    
    <div class="equations">
        <strong>Schrödinger Wavefunction:</strong> Ψ(r, θ, φ) = R<sub>n,l</sub>(r) · Y<sub>l</sub><sup>m</sup>(θ, φ)<br>
        <strong>Radial Probability:</strong> P(r) = r<sup>2</sup> |R<sub>n,l</sub>(r)|<sup>2</sup>
    </div>

    <div class="controls">
        <div class="control-group">
            <label for="viewMode">View Mode:</label>
            <select id="viewMode" onchange="updateUI()">
                <option value="single">Single Orbital</option>
                <option value="atom">Whole Atom (Overlap)</option>
            </select>
        </div>
        
        <!-- Single Orbital Controls -->
        <div class="control-group single-controls">
            <label for="n_val">Principal (n):</label>
            <input type="number" id="n_val" min="1" max="10" value="1" onchange="updateSimulation()">
        </div>
        <div class="control-group single-controls">
            <label for="l_val">Angular (l):</label>
            <input type="number" id="l_val" min="0" max="9" value="0" onchange="updateSimulation()">
        </div>
        <div class="control-group single-controls">
            <label for="m_val">State (s/px/py/pz):</label>
            <select id="m_val" onchange="updateSimulation()">
                <option value="s">s (l=0)</option>
                <option value="pz">pz (l=1)</option>
                <option value="px">px (l=1)</option>
                <option value="py">py (l=1)</option>
            </select>
        </div>

        <!-- Whole Atom Controls -->
        <div class="control-group atom-controls" style="display:none;">
            <label for="atom_val">Element:</label>
            <select id="atom_val" onchange="updateSimulation()">
                <option value="H">Hydrogen (1s)</option>
                <option value="He">Helium (1s)</option>
                <option value="Li">Lithium (1s, 2s)</option>
                <option value="Be">Beryllium (1s, 2s)</option>
                <option value="B">Boron (1s, 2s, 2p)</option>
            </select>
        </div>
    </div>

    <div class="grid">
        <div class="plot-container" id="plot3d" style="height: 600px;"></div>
        <div class="plot-container" id="plot2d" style="height: 600px;"></div>
    </div>
</div>

<script>
// --- Mathematical Functions for Quantum Mechanics ---
function factorial(num) {
    if (num <= 1) return 1;
    let result = 1;
    for (let i = 2; i <= num; i++) result *= i;
    return result;
}

// Generalized Laguerre Polynomial
function laguerre(n, alpha, x) {
    let sum = 0;
    for (let i = 0; i <= n; i++) {
        let sign = (i % 2 === 0) ? 1 : -1;
        let num = factorial(n + alpha);
        let den = factorial(n - i) * factorial(alpha + i) * factorial(i);
        sum += sign * (num / den) * Math.pow(x, i);
    }
    return sum;
}

// Radial Wavefunction R(r)
function radial(n, l, Z, r) {
    let rho = (2 * Z * r) / n;
    let norm = Math.sqrt( Math.pow((2 * Z / n), 3) * (factorial(n - l - 1) / (2 * n * factorial(n + l))) );
    let L = laguerre(n - l - 1, 2 * l + 1, rho);
    return norm * Math.exp(-rho / 2) * Math.pow(rho, l) * L;
}

// Angular Probability |Y|^2
function angularSq(l, m_label, x, y, z, r) {
    if (r === 0) return 0;
    if (l === 0) return 1 / (4 * Math.PI); // s orbital
    
    let polar = Math.acos(z / r);
    let azimuthal = Math.atan2(y, x);
    
    if (l === 1) { // p orbitals
        let norm = 3 / (4 * Math.PI);
        if (m_label === 'pz') return norm * Math.pow(Math.cos(polar), 2);
        if (m_label === 'px') return norm * Math.pow(Math.sin(polar) * Math.cos(azimuthal), 2);
        if (m_label === 'py') return norm * Math.pow(Math.sin(polar) * Math.sin(azimuthal), 2);
    }
    return 1 / (4 * Math.PI);
}

function probabilityDensity(x, y, z, n, l, m_label, Z) {
    let r = Math.sqrt(x*x + y*y + z*z);
    if (r === 0) r = 1e-10;
    let R = radial(n, l, Z, r);
    let Y2 = angularSq(l, m_label, x, y, z, r);
    return Math.pow(R, 2) * Y2;
}

// Rejection Sampling to create point cloud
function generateCloud(n, l, m_label, Z, points, color, name) {
    let rmax = n * n * 4.0 / Z; 
    let xs = [], ys = [], zs = [];
    
    let P_max = 0;
    for(let i=0.1; i<rmax; i+=0.5) {
        let p = (l===0) ? probabilityDensity(i,0,0, n,l,m_label, Z) : probabilityDensity(i,i,i, n,l,m_label, Z);
        if (p > P_max) P_max = p;
    }
    P_max *= 1.2;

    let attempts = 0;
    while (xs.length < points && attempts < 50000) {
        let xt = (Math.random() - 0.5) * 2 * rmax;
        let yt = (Math.random() - 0.5) * 2 * rmax;
        let zt = (Math.random() - 0.5) * 2 * rmax;
        
        let P = probabilityDensity(xt, yt, zt, n, l, m_label, Z);
        if (Math.random() * P_max < P) {
            xs.push(xt); ys.push(yt); zs.push(zt);
        }
        attempts++;
    }
    return { x: xs, y: ys, z: zs, type: 'scatter3d', mode: 'markers', 
             marker: { size: 2, color: color, opacity: 0.5 }, name: name };
}

function updateUI() {
    let mode = document.getElementById('viewMode').value;
    if(mode === 'single') {
        document.querySelectorAll('.single-controls').forEach(el => el.style.display = 'flex');
        document.querySelectorAll('.atom-controls').forEach(el => el.style.display = 'none');
    } else {
        document.querySelectorAll('.single-controls').forEach(el => el.style.display = 'none');
        document.querySelectorAll('.atom-controls').forEach(el => el.style.display = 'flex');
    }
    updateSimulation();
}

function updateSimulation() {
    let mode = document.getElementById('viewMode').value;
    let traces3d = [];
    let traces2d = [];
    
    let configs = [];
    let rmax = 15;

    if (mode === 'single') {
        let n = parseInt(document.getElementById('n_val').value);
        let l = parseInt(document.getElementById('l_val').value);
        let m = document.getElementById('m_val').value;
        if(l >= n) { alert("Angular momentum (l) must be less than n."); return; }
        configs.push({n: n, l: l, m: m, Z: 1, color: '#1f77b4', name: n + (l===0?'s':m)});
        rmax = n * n * 3;
    } else {
        let atom = document.getElementById('atom_val').value;
        rmax = 8;
        if(atom === 'H')  configs.push({n:1, l:0, m:'s', Z:1, color:'#1f77b4', name:'1s'});
        if(atom === 'He') configs.push({n:1, l:0, m:'s', Z:2, color:'#1f77b4', name:'1s'});
        if(atom === 'Li') { configs.push({n:1, l:0, m:'s', Z:3, color:'#1f77b4', name:'1s'}); configs.push({n:2, l:0, m:'s', Z:3, color:'#ff7f0e', name:'2s'}); }
        if(atom === 'Be') { configs.push({n:1, l:0, m:'s', Z:4, color:'#1f77b4', name:'1s'}); configs.push({n:2, l:0, m:'s', Z:4, color:'#ff7f0e', name:'2s'}); }
        if(atom === 'B')  { 
            configs.push({n:1, l:0, m:'s', Z:5, color:'#1f77b4', name:'1s'}); 
            configs.push({n:2, l:0, m:'s', Z:5, color:'#ff7f0e', name:'2s'}); 
            configs.push({n:2, l:1, m:'px', Z:5, color:'#2ca02c', name:'2px'}); 
        }
    }

    configs.forEach(c => {
        traces3d.push(generateCloud(c.n, c.l, c.m, c.Z, 1500, c.color, c.name));
        
        let r_vals = [], p_vals = [];
        for(let r=0; r<=rmax; r+=0.1) {
            let R = radial(c.n, c.l, c.Z, r);
            r_vals.push(r);
            p_vals.push(r * r * R * R);
        }
        traces2d.push({ x: r_vals, y: p_vals, type: 'scatter', mode: 'lines', name: c.name, line: {color: c.color} });
    });

    Plotly.newPlot('plot3d', traces3d, { scene: { xaxis: {title: 'X'}, yaxis: {title: 'Y'}, zaxis: {title: 'Z'} }, margin: {l:0, r:0, b:0, t:0} });
    Plotly.newPlot('plot2d', traces2d, { xaxis: {title: 'Distance (r)'}, yaxis: {title: 'Probability P(r)'}, margin: {t:30} });
}

window.onload = updateSimulation;
</script>
</body>
</html>
